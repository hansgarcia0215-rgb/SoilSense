services:
  - type: web
    name: soilsense-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://soilsense-liard.vercel.app
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: ADMIN_UID
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ESP32_DEVICE_API_KEY
        sync: false
      - key: IMAGE_PROCESSING_URL
        sync: false
      - key: FUZZY_ENGINE_URL
        sync: false
      - key: SERVICE_API_KEY
        sync: false

  - type: web
    name: soilsense-image-processing
    runtime: python
    plan: free
    rootDir: image-processing
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn api.app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: REQUIRE_SERVICE_API_KEY
        value: "true"
      - key: SERVICE_API_KEY
        sync: false

  - type: web
    name: soilsense-fuzzy-engine
    runtime: python
    plan: free
    rootDir: fuzzy-engine
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn api.app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: REQUIRE_SERVICE_API_KEY
        value: "true"
      - key: SERVICE_API_KEY
        sync: false
