<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary meta -->
    <title>SoilSense — Soil Fertility Assessment</title>
    <meta name="description"
          content="Cloud-based soil fertility assessment and crop recommendation system for farmers in Roxas, Oriental Mindoro, Philippines." />

    <!-- PWA theme -->
    <meta name="theme-color" content="#16a34a" />
    <meta name="background-color" content="#052e16" />

    <!-- PWA manifest (generated by vite-plugin-pwa) -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iOS Safari PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SoilSense" />

    <!-- iOS touch icons (all pointing to real logo) -->
    <link rel="apple-touch-icon"             href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192x192.png" />

    <!-- Standard favicons (real logo) -->
    <link rel="icon" type="image/png" sizes="32x32"  href="/icons/icon-128x128.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="icon" href="/favicon.png" />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="SoilSense — Soil Fertility Assessment" />
    <meta property="og:description" content="Soil fertility assessment and crop recommendation for Roxas, Oriental Mindoro." />
    <meta property="og:image"       content="/icons/icon-512x512.png" />

    <!-- Mobile helpers -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
